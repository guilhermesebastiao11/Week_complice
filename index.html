<!doctype html>
<html lang="pt" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complice Week Lusophone — Jornalismo, Cultura & Atualidade</title>
    <meta name="description" content="Portal de notícias independente do espaço lusófono com reportagens multimédia, gestão de categorias e comentários em tempo real." />
    <meta property="og:title" content="Complice Week Lusophone" />
    <meta property="og:description" content="Portal de notícias independente do espaço lusófono com reportagens multimédia, gestão de categorias e comentários em tempo real." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('complice_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
          var scale = localStorage.getItem('complice_font_scale');
          if (scale && /^(0\.9|1|1\.12|1\.24)$/.test(scale)) {
            document.documentElement.style.setProperty('--reading-scale', scale);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
